<!doctype html>
<html lang="it">

<head>
    <meta charset="utf-8" />
    <title>Eugenio - Casino Full Page</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-width: 260px;
            max-width: 320px;
            padding: 20px;
            background: #f5f6fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            color: #2f3640;
            text-align: center;
        }

        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
            background: #ffffff;
            padding: 14px 18px;
            border-radius: 14px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .switch-container:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .switch-label-text {
            font-weight: 500;
            color: #2f3640;
            font-size: 15px;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 52px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #dcdde1;
            transition: 0.4s;
            border-radius: 28px;
        }

        .slider::before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 3px;
            bottom: 3px;
            background-color: #fff;
            transition: 0.4s;
            border-radius: 50%;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        input:checked+.slider {
            background: linear-gradient(90deg, #4cd137, #44bd32);
        }

        input:checked+.slider::before {
            transform: translateX(24px);
        }

        .tooltip {
            font-size: 13px;
            color: #718093;
            margin-top: 6px;
            text-align: center;
            line-height: 1.3;
            max-width: 90%;
        }

        .switch-group {
            width: 100%;
            margin-bottom: 14px;
        }
    </style>
</head>

<body>
    <h1>Eugenio - Casino Full Page</h1>

    <div class="switch-group">
        <div class="switch-container">
            <span class="switch-label-text">Full Page</span>
            <label class="switch">
                <input id="enabled" type="checkbox" />
                <span class="slider"></span>
            </label>
        </div>
        <div class="tooltip">Attiva per abilitare la modalità full page</div>
    </div>

    <div class="switch-group">
        <div class="switch-container">
            <span class="switch-label-text">Hide Scrollbar</span>
            <label class="switch">
                <input id="hideScrollbars" type="checkbox" />
                <span class="slider"></span>
            </label>
        </div>
        <div class="tooltip">Attiva per nascondere la barra di scorrimento</div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
