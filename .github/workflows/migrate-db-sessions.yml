name: DASH2A DB Migration - Sessions + Samples

# BLOCCATO — richiede prima ALTER SERVER ROLE sysadmin ADD MEMBER [NT AUTHORITY\SYSTEM] sul server
on:
  workflow_dispatch:
    inputs:
      confirm_migration:
        description: "Type I_UNDERSTAND_DB_MIGRATION to run"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    name: Import MissionSessions + MissionMarginSamples to production DB
    if: ${{ github.event.inputs.confirm_migration == 'I_UNDERSTAND_DB_MIGRATION' }}
    runs-on: [self-hosted, Windows, DASH2A, DASH2A-BACKEND]
    timeout-minutes: 30

    steps:
      - name: Guard
        shell: powershell
        run: |
          Write-Host "DB Migration: MissionSessions + MissionMarginSamples"
          Write-Host "NO schema changes. NO user table changes."

      - name: Ensure Git in PATH
        shell: powershell
        run: |
          Add-Content $env:GITHUB_PATH "C:\Program Files\Git\cmd"
          git config --global --add safe.directory "*"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Grant SYSTEM access to Eugenio-Demo10
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Grant SYSTEM su Eugenio-Demo10 (singola chiamata, partenza da master)..."
          sqlcmd -S "." -E -Q "IF NOT EXISTS (SELECT * FROM master.sys.server_principals WHERE name='NT AUTHORITY\SYSTEM') CREATE LOGIN [NT AUTHORITY\SYSTEM] FROM WINDOWS; USE [Eugenio-Demo10]; IF NOT EXISTS (SELECT * FROM sys.database_principals WHERE name='NT AUTHORITY\SYSTEM') CREATE USER [NT AUTHORITY\SYSTEM] FOR LOGIN [NT AUTHORITY\SYSTEM]; ALTER ROLE db_owner ADD MEMBER [NT AUTHORITY\SYSTEM]; SELECT DB_NAME() as db, SUSER_NAME() as login;" -W

      - name: Check current row counts
        shell: powershell
        run: |
          sqlcmd -S "." -E -d "Eugenio-Demo10" -Q "
            SELECT 'MissionSessions' as tbl, COUNT(*) as righe FROM MissionSessions
            UNION ALL
            SELECT 'MissionMarginSamples', COUNT(*) FROM MissionMarginSamples
          " -W

      - name: Import MissionSessions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Importo 66 MissionSessions..."
          sqlcmd -S "." -E -d "Eugenio-Demo10" -i "ops\migrate-sessions.sql" -W
          sqlcmd -S "." -E -d "Eugenio-Demo10" -Q "SELECT COUNT(*) as MissionSessions_importate FROM MissionSessions" -W

      - name: Decompress and import MissionMarginSamples
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Decomprimo samples..."
          Expand-Archive -Path "ops\migrate-samples.zip" -DestinationPath "$env:TEMP\migrate" -Force
          Write-Host "Importo 227.332 campioni..."
          sqlcmd -S "." -E -d "Eugenio-Demo10" -i "$env:TEMP\migrate\migrate-samples.sql" -W
          Remove-Item "$env:TEMP\migrate" -Recurse -Force

      - name: Verify final counts
        shell: powershell
        run: |
          sqlcmd -S "." -E -d "Eugenio-Demo10" -Q "
            SELECT 'MissionSessions' as tbl, COUNT(*) as righe FROM MissionSessions
            UNION ALL
            SELECT 'MissionMarginSamples', COUNT(*) FROM MissionMarginSamples
          " -W
          Write-Host "Migrazione completata."
