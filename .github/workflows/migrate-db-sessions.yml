name: DASH2A DB Migration - Sessions + Samples

on:
  workflow_dispatch:
    inputs:
      confirm_migration:
        description: "Type I_UNDERSTAND_DB_MIGRATION to run"
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    name: Import MissionSessions + MissionMarginSamples to production DB
    if: ${{ github.event.inputs.confirm_migration == 'I_UNDERSTAND_DB_MIGRATION' }}
    runs-on:
      - self-hosted
      - Windows
      - DASH2A
      - DASH2A-BACKEND
    timeout-minutes: 30

    steps:
      - name: Guard
        shell: powershell
        run: |
          Write-Host "DB Migration: MissionSessions + MissionMarginSamples"
          Write-Host "Target: localhost Eugenio-Demo10"
          Write-Host "NO schema changes. NO user table changes."

      - name: Ensure Git in PATH
        shell: powershell
        run: |
          Add-Content $env:GITHUB_PATH "C:\Program Files\Git\cmd"
          git config --global --add safe.directory "*"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Read connection string from deployed appsettings
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $settingsPath = "C:\inetpub\wwwroot\publish\appsettings.json"
          if (-not (Test-Path $settingsPath)) { throw "appsettings.json non trovato in $settingsPath" }
          $config = Get-Content $settingsPath -Raw | ConvertFrom-Json
          $connStr = $config.ConnectionStrings.DefaultConnection
          # Estrai server, db, user, password
          $parts = @{}
          $connStr -split ';' | ForEach-Object {
            $kv = $_ -split '=', 2
            if ($kv.Count -eq 2) { $parts[$kv[0].Trim()] = $kv[1].Trim() }
          }
          $server = $parts['Server']
          $db     = $parts['Database']
          $user   = $parts['User Id']
          $pass   = $parts['Password']
          Write-Host "Server: $server | DB: $db | User: $user"
          Add-Content $env:GITHUB_ENV "SQL_SERVER=$server"
          Add-Content $env:GITHUB_ENV "SQL_DB=$db"
          Add-Content $env:GITHUB_ENV "SQL_USER=$user"
          Add-Content $env:GITHUB_ENV "SQL_PASS=$pass"

      - name: Check current row counts
        shell: powershell
        run: |
          sqlcmd -S "$env:SQL_SERVER" -U "$env:SQL_USER" -P "$env:SQL_PASS" -d "$env:SQL_DB" -Q "SELECT 'MissionSessions' as tbl, COUNT(*) as righe FROM MissionSessions UNION ALL SELECT 'MissionMarginSamples', COUNT(*) FROM MissionMarginSamples" -W -N -C

      - name: Import MissionSessions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Importo MissionSessions..."
          sqlcmd -S "$env:SQL_SERVER" -U "$env:SQL_USER" -P "$env:SQL_PASS" -d "$env:SQL_DB" -i "ops\migrate-sessions.sql" -W -N -C
          sqlcmd -S "$env:SQL_SERVER" -U "$env:SQL_USER" -P "$env:SQL_PASS" -d "$env:SQL_DB" -Q "SELECT COUNT(*) as MissionSessions_dopo FROM MissionSessions" -W -N -C

      - name: Decompress and import MissionMarginSamples
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Decomprimo samples..."
          Expand-Archive -Path "ops\migrate-samples.zip" -DestinationPath "$env:TEMP\migrate" -Force
          Write-Host "Importo 227.332 campioni (potrebbe richiedere 5-10 minuti)..."
          sqlcmd -S "$env:SQL_SERVER" -U "$env:SQL_USER" -P "$env:SQL_PASS" -d "$env:SQL_DB" -i "$env:TEMP\migrate\migrate-samples.sql" -W -N -C
          Remove-Item "$env:TEMP\migrate" -Recurse -Force

      - name: Verify final counts
        shell: powershell
        run: |
          sqlcmd -S "$env:SQL_SERVER" -U "$env:SQL_USER" -P "$env:SQL_PASS" -d "$env:SQL_DB" -Q "SELECT 'MissionSessions' as tbl, COUNT(*) as righe FROM MissionSessions UNION ALL SELECT 'MissionMarginSamples', COUNT(*) FROM MissionMarginSamples" -W -N -C
          Write-Host "Migrazione completata."
