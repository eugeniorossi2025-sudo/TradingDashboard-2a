name: DASH2A Diag Users ReadOnly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag-users:
    runs-on: [self-hosted, Windows, DASH2A, DASH2A-BACKEND]
    timeout-minutes: 5

    steps:
      - name: List all tables in Eugenio-Demo10
        shell: powershell
        run: |
          sqlcmd -S "." -U sa3 -P "LionGest123@" -d "Eugenio-Demo10" -Q "SELECT TABLE_SCHEMA, TABLE_NAME FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_TYPE='BASE TABLE' ORDER BY TABLE_NAME;" -W

      - name: Query Users table read-only
        shell: powershell
        run: |
          $sql = @"
          USE [Eugenio-Demo10];
          SELECT TOP 5
            UserName,
            Email,
            EmailConfirmed,
            LockoutEnabled,
            LockoutEnd,
            AccessFailedCount,
            CASE WHEN PasswordHash IS NULL THEN 'NO_HASH' ELSE 'HAS_HASH' END AS PasswordHashStatus
          FROM dbo.Users
          WHERE UserName = 'admin' OR Email LIKE '%admin%';
          "@
          sqlcmd -S "." -U sa3 -P "LionGest123@" -Q $sql -W
