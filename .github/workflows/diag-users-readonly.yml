name: DASH2A Diag Users ReadOnly

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag-users:
    runs-on: [self-hosted, Windows, DASH2A, DASH2A-BACKEND]
    timeout-minutes: 5

    steps:
      - name: List all tables via sa3
        shell: powershell
        run: |
          sqlcmd -S "51.83.159.175,1433" -U sa3 -P "LionGest123@" -d "Eugenio-Demo10" -Q "SELECT TABLE_SCHEMA, TABLE_NAME FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_TYPE='BASE TABLE' ORDER BY TABLE_NAME;" -W

      - name: Query Identity Users table via sa3
        shell: powershell
        run: |
          sqlcmd -S "51.83.159.175,1433" -U sa3 -P "LionGest123@" -d "Eugenio-Demo10" -Q "
            SELECT TOP 10
              UserName,
              Email,
              EmailConfirmed,
              LockoutEnabled,
              LockoutEnd,
              AccessFailedCount,
              CASE WHEN PasswordHash IS NULL THEN 'NO_HASH' ELSE 'HAS_HASH' END AS PwdStatus
            FROM AspNetUsers;
          " -W
