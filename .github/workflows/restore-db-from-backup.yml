name: DASH2A Restore DB From Backup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESTORE_EUGENIO_DEMO10 to proceed'
        required: true

permissions:
  contents: read

jobs:
  restore-db:
    name: Restore Eugenio-Demo10 from backup
    if: github.event.inputs.confirm == 'RESTORE_EUGENIO_DEMO10'
    runs-on: [self-hosted, Windows, DASH2A, DASH2A-BACKEND]
    timeout-minutes: 20

    steps:
      - name: A - Verify backup file exists
        shell: powershell
        run: |
          $bak = 'C:\Program Files\Microsoft SQL Server\MSSQL17.SQLEXPRESS01\MSSQL\Backup\Eugenio-Demo10_pre_mission_tables_20260524_192426.bak'
          if (Test-Path $bak) {
            Write-Host "BACKUP_EXISTS=YES size=$([math]::Round((Get-Item $bak).Length/1MB,2))MB"
          } else {
            Write-Error "BACKUP NOT FOUND: $bak"
          }

      - name: B - Current DB state (sa3)
        shell: powershell
        run: |
          sqlcmd -S "51.83.159.175,1433" -U sa3 -P "LionGest123@" -d "Eugenio-Demo10" -Q "SELECT COUNT(*) AS TableCount FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_TYPE='BASE TABLE';" -W

      - name: C - RESTORE VERIFYONLY via Windows Auth
        shell: powershell
        run: |
          $bak = 'C:\Program Files\Microsoft SQL Server\MSSQL17.SQLEXPRESS01\MSSQL\Backup\Eugenio-Demo10_pre_mission_tables_20260524_192426.bak'
          sqlcmd -S ".\SQLEXPRESS" -E -Q "RESTORE VERIFYONLY FROM DISK = '$bak';" -W
          if ($LASTEXITCODE -eq 0) {
            Write-Host "VERIFY=OK"
          } else {
            Write-Host "VERIFY=FAIL (SYSTEM manca sysadmin - serve noVNC)"
          }

      - name: D - RESTORE DATABASE WITH REPLACE
        shell: powershell
        run: |
          $bak = 'C:\Program Files\Microsoft SQL Server\MSSQL17.SQLEXPRESS01\MSSQL\Backup\Eugenio-Demo10_pre_mission_tables_20260524_192426.bak'
          sqlcmd -S ".\SQLEXPRESS" -E -Q "ALTER DATABASE [Eugenio-Demo10] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; RESTORE DATABASE [Eugenio-Demo10] FROM DISK = '$bak' WITH REPLACE, STATS=10; ALTER DATABASE [Eugenio-Demo10] SET MULTI_USER; PRINT 'RESTORE_DONE';" -W
          if ($LASTEXITCODE -eq 0) {
            Write-Host "RESTORE=OK"
          } else {
            Write-Host "RESTORE=FAIL"
          }

      - name: E - Post-restore verify
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          sqlcmd -S "51.83.159.175,1433" -U sa3 -P "LionGest123@" -d "Eugenio-Demo10" -Q "SELECT TABLE_SCHEMA, TABLE_NAME FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_TYPE='BASE TABLE' ORDER BY TABLE_NAME;" -W
          sqlcmd -S "51.83.159.175,1433" -U sa3 -P "LionGest123@" -d "Eugenio-Demo10" -Q "IF OBJECT_ID('dbo.Users') IS NOT NULL SELECT UserName, Email, EmailConfirmed, LockoutEnabled, CASE WHEN PasswordHash IS NULL THEN 'NO_HASH' ELSE 'HAS_HASH' END AS PwdStatus FROM dbo.Users; ELSE IF OBJECT_ID('dbo.Users_v2') IS NOT NULL SELECT UserName, Email, EmailConfirmed, LockoutEnabled, CASE WHEN PasswordHash IS NULL THEN 'NO_HASH' ELSE 'HAS_HASH' END AS PwdStatus FROM dbo.Users_v2; ELSE PRINT 'no users table';" -W
