name: TEST - Bot E2E chain v2 (Decisore -> DB -> Dashboard)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on:
      - self-hosted
      - Windows
      - DASH2A
      - DASH2A-BACKEND
    timeout-minutes: 10

    steps:
      - name: E2E bot chain test
        shell: powershell
        run: |
          $cs = "Server=51.83.159.175,1434;Database=Eugenio-Demo10;User Id=sa3;Password=LionGest123@;Encrypt=False;TrustServerCertificate=True;Connect Timeout=10;"

          Write-Host "============================================"
          Write-Host "STEP 0 — Utenti validi su DB 1434"
          Write-Host "============================================"
          $conn = New-Object System.Data.SqlClient.SqlConnection($cs)
          $conn.Open()
          $cmd = $conn.CreateCommand()
          $cmd.CommandText = "SELECT TOP 5 Username, Password FROM dbo.Users_v2 ORDER BY ID"
          $r = $cmd.ExecuteReader()
          $botUser = $null; $botPass = $null
          while ($r.Read()) {
            Write-Host "  User=$($r['Username']) Pass=$($r['Password'])"
            if ($null -eq $botUser) { $botUser = $r['Username']; $botPass = $r['Password'] }
          }
          $r.Close()
          $conn.Close()

          Write-Host ""
          Write-Host "Uso credenziali: USER=$botUser"

          Write-Host ""
          Write-Host "============================================"
          Write-Host "STEP 1 — Pc_CurrentStatus PRIMA del test"
          Write-Host "============================================"
          $conn = New-Object System.Data.SqlClient.SqlConnection($cs)
          $conn.Open()
          $cmd = $conn.CreateCommand()
          $cmd.CommandText = "SELECT COUNT(*) FROM dbo.Pc_CurrentStatus"
          $before = $cmd.ExecuteScalar()
          Write-Host "Righe prima: $before"
          $conn.Close()

          Write-Host ""
          Write-Host "============================================"
          Write-Host "STEP 2 — Chiama Decisore /decide (payload bot simulato)"
          Write-Host "============================================"
          $testPc = "TEST-BOT-E2E"
          $params = "USERNAME=$botUser&PASSWORD=$botPass&COMPUTER=$testPc&TAVOLO=1&MAZZO=5&PBT=P&COLPO_MARTINGALA=0&MARGINE=12.50&SALDO_INIZIALE=1000&VALORE_GIOCATO=1&STATO=OK&CHOSEN_COLOR=R&TEMPO=01:30"
          $url = "http://51.178.16.37/api/proactive/decide?$params"
          try {
            $resp = Invoke-WebRequest -Uri $url -TimeoutSec 10 -UseBasicParsing
            Write-Host "Decisore /decide: STATUS=$($resp.StatusCode) BODY=$($resp.Content)"
          } catch {
            Write-Host "Decisore /decide: ERRORE $($_.Exception.Message)"
          }

          Start-Sleep -Seconds 3

          Write-Host ""
          Write-Host "============================================"
          Write-Host "STEP 3 — Pc_CurrentStatus DOPO il test"
          Write-Host "============================================"
          $conn = New-Object System.Data.SqlClient.SqlConnection($cs)
          $conn.Open()
          $cmd = $conn.CreateCommand()
          $cmd.CommandText = "SELECT COUNT(*) FROM dbo.Pc_CurrentStatus"
          $after = $cmd.ExecuteScalar()
          Write-Host "Righe dopo: $after"
          if ($after -gt 0) {
            $cmd2 = $conn.CreateCommand()
            $cmd2.CommandText = "SELECT TOP 5 COMPUTER, MARGINE, LAST_UPDATE, LAST_ADVICE FROM dbo.Pc_CurrentStatus ORDER BY LAST_UPDATE DESC"
            $r2 = $cmd2.ExecuteReader()
            while ($r2.Read()) {
              $adv = $r2['LAST_ADVICE']
              $advShort = if ($adv -ne [DBNull]::Value) { [string]$adv | Select-Object -First 1 } else { "(null)" }
              $advShort = if ($advShort.Length -gt 100) { $advShort.Substring(0,100) + "..." } else { $advShort }
              Write-Host "  COMPUTER=$($r2['COMPUTER']) MARGINE=$($r2['MARGINE']) LAST_UPDATE=$($r2['LAST_UPDATE'])"
              Write-Host "  LAST_ADVICE=$advShort"
            }
            $r2.Close()
          }
          $conn.Close()

          Write-Host ""
          Write-Host "============================================"
          Write-Host "STEP 4 — WebApi Dashboard/data (con TLS skip)"
          Write-Host "============================================"
          # Login
          add-type @"
using System.Net;
using System.Security.Cryptography.X509Certificates;
public class TrustAll : ICertificatePolicy {
  public bool CheckValidationResult(ServicePoint sp, X509Certificate cert, WebRequest req, int problem) { return true; }
}
"@
          [System.Net.ServicePointManager]::CertificatePolicy = New-Object TrustAll
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          try {
            $lr = Invoke-RestMethod -Uri "https://vps-b0942869.vps.ovh.net/api/Auth/login" `
              -Method POST -Body '{"username":"admin","password":"Admin@123456"}' `
              -ContentType "application/json" -TimeoutSec 10
            $tok = $lr.data.token
            Write-Host "Login WebApi: OK"
            $h = @{ Authorization = "Bearer $tok" }

            $dd = Invoke-RestMethod -Uri "https://vps-b0942869.vps.ovh.net/api/Dashboard/data" -Headers $h -TimeoutSec 10
            Write-Host "Dashboard/data: tabelle=$($dd.data.tables.Count) margine_tot=$($dd.data.statistics.totalMargine)"
            if ($dd.data.tables.Count -gt 0) {
              foreach ($row in $dd.data.tables) {
                Write-Host "  BOT: computer=$($row.computer) margine=$($row.margine) stato=$($row.stato) lastUpdate=$($row.lastUpdate)"
              }
            }

            $rm = Invoke-RestMethod -Uri "https://vps-b0942869.vps.ovh.net/api/runtime-mode" -Headers $h -TimeoutSec 5
            Write-Host "Runtime mode: $($rm.data)"
          } catch {
            Write-Host "WebApi: ERRORE $($_.Exception.Message)"
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "STEP 5 — Cleanup: rimuovi riga test da Pc_CurrentStatus"
          Write-Host "============================================"
          $conn = New-Object System.Data.SqlClient.SqlConnection($cs)
          $conn.Open()
          $cmdDel = $conn.CreateCommand()
          $cmdDel.CommandText = "DELETE FROM dbo.Pc_CurrentStatus WHERE COMPUTER = '$testPc'"
          $deleted = $cmdDel.ExecuteNonQuery()
          Write-Host "Righe eliminate: $deleted"
          $conn.Close()

          Write-Host ""
          Write-Host "============================================"
          Write-Host "RIEPILOGO"
          Write-Host "============================================"
          Write-Host "Pc_CurrentStatus PRIMA:  $before"
          Write-Host "Pc_CurrentStatus DOPO:   $after"
          Write-Host "Delta: $($after - $before)"
          if ($after -gt $before) {
            Write-Host "CATENA OK: Bot -> Decisore -> DB -> WebApi -> Dashboard FUNZIONA"
          } else {
            Write-Host "CATENA KO: Decisore ha ricevuto la chiamata ma non ha scritto su DB (credenziali errate o errore)"
          }
