name: TEST — Live dashboard endpoints telemetry + margini

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type TEST_LIVE"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Hit /telemetry and /margini-chart on localhost
    if: ${{ github.event.inputs.confirm == 'TEST_LIVE' }}
    runs-on:
      - self-hosted
      - Windows
      - DASH2A
      - DASH2A-BACKEND
    timeout-minutes: 3

    steps:
      - name: Get JWT token and test endpoints
        shell: powershell
        run: |
          # PS 5.1 compatible SSL bypass
          Add-Type @"
            using System.Net; using System.Security.Cryptography.X509Certificates;
            public class TrustAll : ICertificatePolicy {
              public bool CheckValidationResult(ServicePoint sp, X509Certificate cert, WebRequest req, int problem) { return true; }
            }
"@
          [System.Net.ServicePointManager]::CertificatePolicy = New-Object TrustAll
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12

          $base = "https://localhost"

          # 1. Login
          $loginBody = @{ email = "admin@dash2a.local"; password = "Admin123!" } | ConvertTo-Json
          try {
            $login = Invoke-RestMethod -Uri "$base/api/auth/login" -Method POST -Body $loginBody -ContentType "application/json"
            $token = $login.token
            Write-Host "LOGIN: OK"
          } catch {
            Write-Host "LOGIN FAILED: $($_.Exception.Message)"
            $token = $null
          }

          $headers = if ($token) { @{ Authorization = "Bearer $token" } } else { @{} }

          # 2. Test /api/dashboard/telemetry
          try {
            $t = Invoke-RestMethod -Uri "$base/api/dashboard/telemetry" -Method GET -Headers $headers
            Write-Host "TELEMETRY: OK"
            Write-Host ($t | ConvertTo-Json -Depth 4 -Compress)
          } catch {
            Write-Host "TELEMETRY: FAILED - $($_.Exception.Message)"
          }

          # 3. Test /api/dashboard/margini-chart
          try {
            $m = Invoke-RestMethod -Uri "$base/api/dashboard/margini-chart" -Method GET -Headers $headers
            Write-Host "MARGINI: OK - $($m.Count) points"
            $m | Select-Object -First 5 | ForEach-Object { Write-Host "  $($_ | ConvertTo-Json -Compress)" }
          } catch {
            Write-Host "MARGINI: FAILED - $($_.Exception.Message)"
          }

          # 4. Test /api/dashboard/status
          try {
            $s = Invoke-RestMethod -Uri "$base/api/dashboard/status" -Method GET -Headers $headers
            Write-Host "STATUS: OK"
            Write-Host ($s | ConvertTo-Json -Depth 3 -Compress)
          } catch {
            Write-Host "STATUS: FAILED - $($_.Exception.Message)"
          }
