name: FIX - Create dbo.Statistiche for Decisore

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type FIX_STATISTICHE to confirm"
        required: true
        type: string

permissions:
  contents: read

jobs:
  fix:
    name: Create dbo.Statistiche and fix Decisore
    if: ${{ github.event.inputs.confirm == 'FIX_STATISTICHE' }}
    runs-on:
      - self-hosted
      - Windows
      - DASH2A
      - DASH2A-BACKEND
    timeout-minutes: 5

    steps:
      - name: Create dbo.Statistiche on SQLEXPRESS01 port 1434
        shell: powershell
        run: |
          $cs = "Server=51.83.159.175,1434;Database=Eugenio-Demo10;User Id=sa3;Password=LionGest123@;Encrypt=False;TrustServerCertificate=True;Connect Timeout=15;"
          $sql = "IF NOT EXISTS (SELECT 1 FROM sys.objects WHERE object_id=OBJECT_ID(N'dbo.Statistiche') AND type='U') BEGIN CREATE TABLE dbo.Statistiche (ID INT IDENTITY(1,1) NOT NULL PRIMARY KEY, DATA_INIZIO DATETIME NULL, DATA_FINE DATETIME NULL, MARGINE_TOT DECIMAL(18,2) NULL DEFAULT 0, MARGINE_MIN DECIMAL(18,2) NULL DEFAULT 0, MARGINE_MAX DECIMAL(18,2) NULL DEFAULT 0, ELAPSED DECIMAL(18,4) NULL DEFAULT 0, TELEMETRY NVARCHAR(MAX) NULL); PRINT 'CREATA' END ELSE PRINT 'GIA ESISTE'"
          Write-Host "Connessione a SQLEXPRESS01:1434..."
          $conn = New-Object System.Data.SqlClient.SqlConnection($cs)
          $conn.Open()
          Write-Host "Connesso OK"
          $cmd = $conn.CreateCommand()
          $cmd.CommandText = $sql
          $cmd.ExecuteNonQuery() | Out-Null
          Write-Host "SQL eseguito"
          $cmd2 = $conn.CreateCommand()
          $cmd2.CommandText = "SELECT COUNT(*) FROM sys.objects WHERE object_id=OBJECT_ID(N'dbo.Statistiche') AND type='U'"
          $exists = $cmd2.ExecuteScalar()
          Write-Host "dbo.Statistiche exists: $($exists -eq 1)"
          $conn.Close()
          if ($exists -ne 1) { Write-Error "TABELLA NON CREATA"; exit 1 }
          Write-Host "=== dbo.Statistiche OK ==="

      - name: Print next steps
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=== TABELLA CREATA ==="
          Write-Host ""
          Write-Host "ORA sul VPS 51.178.16.37 (RDP) esegui:"
          Write-Host ""
          Write-Host "STEP 1 - Aggiorna porta in appsettings.json:"
          Write-Host '(Get-Content C:\Decisore\appsettings.json -Raw) -replace "1433","1434" | Set-Content C:\Decisore\appsettings.json'
          Write-Host ""
          Write-Host "STEP 2 - Riavvia app pool:"
          Write-Host '& "$env:windir\system32\inetsrv\appcmd.exe" stop apppool /apppool.name:Proactive; Start-Sleep 3; & "$env:windir\system32\inetsrv\appcmd.exe" start apppool /apppool.name:Proactive'
          Write-Host ""
          Write-Host "STEP 3 - Verifica:"
          Write-Host 'Invoke-WebRequest http://127.0.0.1/api/proactive/reset -UseBasicParsing | Select-Object StatusCode'
