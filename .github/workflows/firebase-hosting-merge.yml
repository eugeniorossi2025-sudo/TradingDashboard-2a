name: Firebase Hosting Live
on:
  workflow_dispatch:
    inputs:
      confirm_frontend_deploy:
        description: "Type DEPLOY_FRONTEND to deploy Firebase"
        required: true
        type: string
permissions:
  contents: read
jobs:
  build_and_deploy:
    if: ${{ github.event.inputs.confirm_frontend_deploy == 'DEPLOY_FRONTEND' }}
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: https://vps-b0942869.vps.ovh.net
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_EUGENIO_DASHBOARD_2 }}
          channelId: live
          projectId: eugenio-dashboard-2a
          entryPoint: ./frontend
