name: DASH2A Runner Test (Build Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-runner-build:
    name: Test Runner - Checkout + Build Only (NO DEPLOY)
    runs-on:
      - self-hosted
      - Windows
      - DASH2A
      - DASH2A-BACKEND
    timeout-minutes: 15
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Confirm test scope
        shell: powershell
        run: |
          Write-Host "TEST ONLY - No IIS changes, no deploy, no DB changes."

      - name: Ensure Git is installed and in GITHUB_PATH
        shell: powershell
        run: |
          # Cerca git.exe ovunque
          $gitExe = Get-Command git -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $gitExe) {
            $gitExe = Get-ChildItem "C:\", "C:\Program Files", "C:\Program Files (x86)" -Recurse -Filter "git.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $gitExe) {
            Write-Host "Git non trovato - installo via Chocolatey..."
            Set-ExecutionPolicy Bypass -Scope Process -Force
            [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
            iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
            choco install git -y --no-progress
            $gitExe = "C:\Program Files\Git\cmd\git.exe"
          }

          $gitDir = Split-Path $gitExe -Parent
          Write-Host "Git trovato in: $gitDir"
          Add-Content $env:GITHUB_PATH $gitDir
          & $gitExe --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        shell: powershell
        run: dotnet restore backend\WebApi\WebApi.csproj

      - name: Build Release
        shell: powershell
        run: dotnet build backend\WebApi\WebApi.csproj --configuration Release --no-restore

      - name: Runner OK
        shell: powershell
        run: Write-Host "Runner OK - Build completata. Nessun deploy eseguito."
