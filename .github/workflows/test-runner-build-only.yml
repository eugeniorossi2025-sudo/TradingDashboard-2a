name: DASH2A Runner Test (Build Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-runner-build:
    name: Test Runner - Checkout + Build Only (NO DEPLOY)
    runs-on:
      - self-hosted
      - Windows
      - DASH2A
      - DASH2A-BACKEND
    timeout-minutes: 15
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Confirm test scope
        shell: powershell
        run: |
          Write-Host "TEST ONLY - No IIS changes, no deploy, no DB changes."

      - name: Ensure Git is in PATH
        shell: powershell
        run: |
          $gitCmd = "C:\Program Files\Git\cmd\git.exe"
          if (Test-Path $gitCmd) {
            Write-Host "Git gia installato."
          } else {
            Write-Host "Git non trovato - scarico e installo..."
            $installer = "$env:TEMP\git-installer.exe"
            Invoke-WebRequest -Uri "https://github.com/git-for-windows/git/releases/download/v2.45.2.windows.1/Git-2.45.2-64-bit.exe" -OutFile $installer -UseBasicParsing
            Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /NORESTART /NOCANCEL /SP-" -Wait
            Write-Host "Git installato."
          }
          $env:PATH = "C:\Program Files\Git\cmd;$env:PATH"
          [System.Environment]::SetEnvironmentVariable("PATH", $env:PATH, "Machine")
          git --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore
        shell: powershell
        run: dotnet restore backend\WebApi\WebApi.csproj

      - name: Build Release
        shell: powershell
        run: dotnet build backend\WebApi\WebApi.csproj --configuration Release --no-restore

      - name: Runner OK
        shell: powershell
        run: Write-Host "Runner OK - Build completata. Nessun deploy eseguito."
