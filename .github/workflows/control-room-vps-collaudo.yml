name: DASH2A Control Room VPS Collaudo

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RUN_COLLAUDO to execute control-room-vps-collaudo.ps1 on Decisore VPS"
        required: true
        type: string

permissions:
  contents: read

jobs:
  collaudo:
    name: Control Room E2E on Decisore VPS
    if: ${{ github.event.inputs.confirm == 'RUN_COLLAUDO' }}
    runs-on:
      - self-hosted
      - Windows
      - DASH2A
      - DASH2A-DECISORE
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run VPS collaudo script
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DECISORE_URL = 'http://127.0.0.1'
          & "$env:GITHUB_WORKSPACE\tools\control-room-vps-collaudo.ps1"
          if ($LASTEXITCODE -ne 0) {
            throw "Control Room VPS collaudo FAILED"
          }
          Write-Host "CONTROL_ROOM_VPS_COLLAUDO_PASS"
