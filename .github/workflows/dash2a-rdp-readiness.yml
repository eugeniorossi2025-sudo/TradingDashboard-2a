name: DASH2A Server Inventory

on:
  workflow_dispatch:
    inputs:
      confirm_inventory_only:
        description: "Type I_UNDERSTAND_INVENTORY_ONLY to run read-only server inventory"
        required: true
        type: string

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: pwsh

jobs:
  inventory:
    name: Read-only inventory on DASH2A self-hosted runner
    runs-on: [self-hosted, Windows, DASH2A]
    timeout-minutes: 10

    steps:
      - name: Guardrail - manual confirmation required
        run: |
          if ('${{ github.event.inputs.confirm_inventory_only }}' -ne 'I_UNDERSTAND_INVENTORY_ONLY') {
            Write-Host 'This workflow is read-only inventory and requires explicit manual confirmation.'
            exit 1
          }

      - name: Guardrail - read only
        run: |
          Write-Host 'DASH2A server inventory only.'
          Write-Host 'No deploy will be executed.'
          Write-Host 'No IIS restart will be executed.'
          Write-Host 'No server files will be edited.'
          Write-Host 'No RDP password is used by this job.'

      - name: Generate read-only server inventory
        run: |
          $ErrorActionPreference = 'Continue'
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'dash2a-server-inventory'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $report = Join-Path $outDir 'inventory.md'

          Set-Content -Path $report -Value '# DASH2A Server Inventory'
          Add-Content -Path $report -Value ''
          Add-Content -Path $report -Value 'Read-only inventory generated by GitHub Actions self-hosted runner.'
          Add-Content -Path $report -Value 'No deploy, no restart, no runtime edit.'
          Add-Content -Path $report -Value ''
          Add-Content -Path $report -Value "Generated UTC: $((Get-Date).ToUniversalTime().ToString('s'))Z"

          function Add-JsonSection($Title, $Object) {
            Add-Content -Path $report -Value "`n## $Title`n"
            if ($null -eq $Object) {
              Add-Content -Path $report -Value 'Not available.'
            } else {
              $Object | ConvertTo-Json -Depth 8 | Add-Content -Path $report
            }
          }

          Add-JsonSection 'Computer' (Get-CimInstance Win32_ComputerSystem | Select-Object Name, Domain, Manufacturer, Model, TotalPhysicalMemory)
          Add-JsonSection 'Operating System' (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture, LastBootUpTime)
          Add-JsonSection 'IPv4 Addresses' (Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '169.254*' } | Select-Object InterfaceAlias, IPAddress, PrefixLength)
          Add-JsonSection 'Listening TCP Ports' (Get-NetTCPConnection -State Listen | Select-Object LocalAddress, LocalPort, OwningProcess | Sort-Object LocalPort -Unique)
          Add-JsonSection 'Firewall Profiles' (Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultInboundAction, DefaultOutboundAction)
          Add-JsonSection 'Relevant Services' (Get-Service | Where-Object { $_.Name -match 'IIS|W3SVC|WAS|MSSQL|SQL|dotnet|Kestrel|nginx|apache|redis|node|pm2|Trading|Dashboard|Decisore|Decision' -or $_.DisplayName -match 'IIS|World Wide Web|SQL|dotnet|Trading|Dashboard|Decision' } | Select-Object Name, DisplayName, Status, StartType)
          Add-JsonSection 'Relevant Scheduled Tasks' (Get-ScheduledTask | Where-Object { $_.TaskName -match 'deploy|dashboard|trading|decision|backup|restart|iis|dotnet|node' } | Select-Object TaskName, TaskPath, State)

          $iisModule = Get-Module -ListAvailable WebAdministration | Select-Object -First 1
          if ($iisModule) {
            Import-Module WebAdministration
            Add-JsonSection 'IIS Sites' (Get-Website | Select-Object Name, State, PhysicalPath, Bindings)
            Add-JsonSection 'IIS App Pools' (Get-ChildItem IIS:\AppPools | Select-Object Name, State, managedRuntimeVersion, managedPipelineMode, startMode)
            Add-JsonSection 'IIS Applications' (Get-WebApplication | Select-Object path, applicationPool, physicalPath)
          } else {
            Add-JsonSection 'IIS' 'WebAdministration module not available.'
          }

          Write-Host "Inventory artifact created: $report"

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: dash2a-server-inventory
          path: dash2a-server-inventory/
          if-no-files-found: error
          retention-days: 7
