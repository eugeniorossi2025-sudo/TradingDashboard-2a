name: DASH2A Server Inventory

on:
  workflow_dispatch:
    inputs:
      confirm_inventory_only:
        description: "Type I_UNDERSTAND_INVENTORY_ONLY to run read-only server inventory"
        required: true
        type: string

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: pwsh

jobs:
  inventory:
    name: Read-only inventory on DASH2A self-hosted runner
    runs-on: [self-hosted, Windows, DASH2A]
    timeout-minutes: 15

    steps:
      - name: Guardrail - manual confirmation required
        run: |
          if ('${{ github.event.inputs.confirm_inventory_only }}' -ne 'I_UNDERSTAND_INVENTORY_ONLY') {
            Write-Host 'This workflow is read-only inventory and requires explicit manual confirmation.'
            exit 1
          }

      - name: Guardrail - read only
        run: |
          Write-Host 'DASH2A server inventory only.'
          Write-Host 'No deploy will be executed.'
          Write-Host 'No IIS restart will be executed.'
          Write-Host 'No server files will be edited.'
          Write-Host 'No RDP password is used by this job.'

      - name: Generate read-only server inventory
        run: |
          $ErrorActionPreference = 'Continue'
          $outDir = Join-Path $env:GITHUB_WORKSPACE 'dash2a-server-inventory'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $report = Join-Path $outDir 'inventory.md'

          Set-Content -Path $report -Value '# DASH2A Server Inventory'
          Add-Content -Path $report -Value ''
          Add-Content -Path $report -Value 'Read-only inventory generated by GitHub Actions self-hosted Windows runner.'
          Add-Content -Path $report -Value 'No deploy, no restart, no runtime edit.'
          Add-Content -Path $report -Value ''
          Add-Content -Path $report -Value "Generated UTC: $((Get-Date).ToUniversalTime().ToString('s'))Z"
          Add-Content -Path $report -Value "Runner name: $env:RUNNER_NAME"
          Add-Content -Path $report -Value "Machine name: $env:COMPUTERNAME"

          function Add-JsonSection($Title, $Object) {
            Add-Content -Path $report -Value "`n## $Title`n"
            if ($null -eq $Object) {
              Add-Content -Path $report -Value 'Not available.'
            } else {
              $Object | ConvertTo-Json -Depth 10 | Add-Content -Path $report
            }
          }

          function Safe-Run($ScriptBlock) {
            try { & $ScriptBlock } catch { @{ error = $_.Exception.Message } }
          }

          Add-JsonSection 'Computer' (Safe-Run { Get-CimInstance Win32_ComputerSystem | Select-Object Name, Domain, Manufacturer, Model, TotalPhysicalMemory })
          Add-JsonSection 'Operating System' (Safe-Run { Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture, LastBootUpTime })
          Add-JsonSection 'Disks' (Safe-Run { Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" | Select-Object DeviceID, VolumeName, Size, FreeSpace })
          Add-JsonSection 'IPv4 Addresses' (Safe-Run { Get-NetIPAddress -AddressFamily IPv4 | Where-Object { $_.IPAddress -notlike '169.254*' } | Select-Object InterfaceAlias, IPAddress, PrefixLength })
          Add-JsonSection 'DNS Servers' (Safe-Run { Get-DnsClientServerAddress -AddressFamily IPv4 | Select-Object InterfaceAlias, ServerAddresses })
          Add-JsonSection 'Firewall Profiles' (Safe-Run { Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultInboundAction, DefaultOutboundAction })

          $ports = Safe-Run {
            Get-NetTCPConnection -State Listen |
              Select-Object LocalAddress, LocalPort, OwningProcess,
                @{Name='ProcessName';Expression={ try { (Get-Process -Id $_.OwningProcess -ErrorAction Stop).ProcessName } catch { $null } }},
                @{Name='ProcessPath';Expression={ try { (Get-Process -Id $_.OwningProcess -ErrorAction Stop).Path } catch { $null } }} |
              Sort-Object LocalPort -Unique
          }
          Add-JsonSection 'Listening TCP Ports With Process' $ports

          Add-JsonSection 'Relevant Services' (Safe-Run {
            Get-Service | Where-Object {
              $_.Name -match 'IIS|W3SVC|WAS|MSSQL|SQL|dotnet|Kestrel|nginx|apache|redis|node|pm2|Trading|Dashboard|Decisore|Decision|Runner' -or
              $_.DisplayName -match 'IIS|World Wide Web|SQL|dotnet|Trading|Dashboard|Decision|GitHub Actions Runner'
            } | Select-Object Name, DisplayName, Status, StartType
          })

          Add-JsonSection 'Relevant Processes' (Safe-Run {
            Get-Process | Where-Object {
              $_.ProcessName -match 'w3wp|iisexpress|dotnet|node|nginx|httpd|sqlservr|redis|Runner|powershell|pwsh'
            } | Select-Object ProcessName, Id, CPU, WorkingSet, Path
          })

          Add-JsonSection 'Relevant Scheduled Tasks' (Safe-Run {
            Get-ScheduledTask | Where-Object {
              $_.TaskName -match 'deploy|dashboard|trading|decision|backup|restart|iis|dotnet|node|runner'
            } | Select-Object TaskName, TaskPath, State
          })

          Add-JsonSection 'Dotnet Info' (Safe-Run {
            $dotnet = Get-Command dotnet -ErrorAction SilentlyContinue
            if ($dotnet) {
              [ordered]@{
                Path = $dotnet.Source
                Info = (& dotnet --info) -join "`n"
                Runtimes = (& dotnet --list-runtimes) -join "`n"
                Sdks = (& dotnet --list-sdks) -join "`n"
              }
            } else {
              'dotnet command not found'
            }
          })

          Add-JsonSection 'Node Info' (Safe-Run {
            $node = Get-Command node -ErrorAction SilentlyContinue
            $npm = Get-Command npm -ErrorAction SilentlyContinue
            [ordered]@{
              NodePath = if ($node) { $node.Source } else { $null }
              NodeVersion = if ($node) { (& node --version) } else { $null }
              NpmPath = if ($npm) { $npm.Source } else { $null }
              NpmVersion = if ($npm) { (& npm --version) } else { $null }
            }
          })

          Add-JsonSection 'Installed Programs Relevant' (Safe-Run {
            $paths = @(
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
            )
            Get-ItemProperty $paths -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -match 'IIS|URL Rewrite|Hosting Bundle|\.NET|Node|Git|SQL|Redis|Chrome|Firefox|Visual C\+\+' } |
              Select-Object DisplayName, DisplayVersion, Publisher, InstallDate |
              Sort-Object DisplayName
          })

          Add-JsonSection 'Certificates LocalMachine My' (Safe-Run {
            Get-ChildItem Cert:\LocalMachine\My -ErrorAction SilentlyContinue |
              Select-Object Subject, Issuer, NotBefore, NotAfter, Thumbprint, HasPrivateKey
          })

          $iisModule = Get-Module -ListAvailable WebAdministration | Select-Object -First 1
          if ($iisModule) {
            Import-Module WebAdministration
            Add-JsonSection 'IIS Sites' (Safe-Run { Get-Website | Select-Object Name, Id, State, PhysicalPath, Bindings })
            Add-JsonSection 'IIS App Pools' (Safe-Run { Get-ChildItem IIS:\AppPools | Select-Object Name, State, managedRuntimeVersion, managedPipelineMode, startMode, processModel })
            Add-JsonSection 'IIS Applications' (Safe-Run { Get-WebApplication | Select-Object path, applicationPool, physicalPath })
            Add-JsonSection 'IIS Virtual Directories' (Safe-Run { Get-WebVirtualDirectory | Select-Object path, physicalPath })
            Add-JsonSection 'IIS URL Rewrite Module' (Safe-Run { Get-WebGlobalModule | Where-Object { $_.Name -match 'Rewrite' } | Select-Object Name, Image })
          } else {
            Add-JsonSection 'IIS' 'WebAdministration module not available.'
          }

          Write-Host "Inventory artifact created: $report"

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: dash2a-server-inventory
          path: dash2a-server-inventory/
          if-no-files-found: error
          retention-days: 7
