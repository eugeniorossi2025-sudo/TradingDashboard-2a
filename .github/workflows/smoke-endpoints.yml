name: SMOKE - Dashboard live endpoints test

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type TEST_LIVE to run"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Test telemetry and margini-chart endpoints
    if: ${{ github.event.inputs.confirm == 'TEST_LIVE' }}
    runs-on:
      - self-hosted
      - Windows
      - DASH2A
      - DASH2A-BACKEND
    timeout-minutes: 5

    steps:
      - name: Test live endpoints
        shell: powershell
        run: |
          [System.Net.ServicePointManager]::ServerCertificateValidationCallback = { $true }
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12

          # Try both HTTP and HTTPS
          $base = "http://localhost"
          Write-Host "Testing base: $base"

          $loginBody = @{ username = "test"; password = "test" } | ConvertTo-Json
          try {
            $resp = Invoke-WebRequest -Uri "$base/api/auth/login" -Method POST -Body $loginBody -ContentType "application/json" -UseBasicParsing
            Write-Host "LOGIN HTTP: $($resp.StatusCode)"
            Write-Host "LOGIN BODY: $($resp.Content)"
            $loginObj = $resp.Content | ConvertFrom-Json
            $token = $loginObj.token
            Write-Host "TOKEN LENGTH: $($token.Length)"
          } catch {
            Write-Host "LOGIN FAILED: $($_.Exception.Message)"
            $token = $null
          }

          if (-not $token) {
            Write-Host "WARNING: no token from http, trying https"
            try {
              $resp2 = Invoke-WebRequest -Uri "https://localhost/api/auth/login" -Method POST -Body $loginBody -ContentType "application/json" -UseBasicParsing
              Write-Host "HTTPS LOGIN HTTP: $($resp2.StatusCode) BODY: $($resp2.Content)"
              $loginObj2 = $resp2.Content | ConvertFrom-Json
              $token = $loginObj2.token
            } catch { Write-Host "HTTPS also failed: $($_.Exception.Message)" }
          }
          $h = if ($token) { @{ Authorization = "Bearer $token" } } else { @{} }
          $base2 = if ($token) { $base } else { "https://localhost" }

          try {
            $t = Invoke-RestMethod -Uri "$base/api/dashboard/telemetry" -Method GET -Headers $h
            Write-Host "TELEMETRY: OK"
            Write-Host ($t | ConvertTo-Json -Depth 4 -Compress)
          } catch {
            Write-Host "TELEMETRY ($base): FAILED - $($_.Exception.Message)"
          }

          try {
            $m = Invoke-RestMethod -Uri "$base/api/dashboard/margini-chart" -Method GET -Headers $h
            Write-Host "MARGINI: OK - $($m.Count) points"
            $m | Select-Object -First 5 | ForEach-Object { Write-Host "  $($_ | ConvertTo-Json -Compress)" }
          } catch {
            Write-Host "MARGINI ($base): FAILED - $($_.Exception.Message)"
          }

          try {
            $s = Invoke-RestMethod -Uri "$base/api/dashboard/data" -Method GET -Headers $h
            Write-Host "DATA: OK"
            Write-Host ($s | ConvertTo-Json -Depth 3 -Compress)
          } catch {
            Write-Host "DATA ($base): FAILED - $($_.Exception.Message)"
          }
