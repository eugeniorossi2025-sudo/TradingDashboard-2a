name: DASH2A Decisore Restart Proactive Only

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RESTART_PROACTIVE to restart app pool only (no deploy)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  restart:
    name: Restart Proactive app pool only
    if: ${{ github.event.inputs.confirm == 'RESTART_PROACTIVE' }}
    runs-on:
      - self-hosted
      - Windows
      - DASH2A
      - DASH2A-DECISORE
    timeout-minutes: 5

    steps:
      - name: Restart Proactive (no deploy, no reset)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module WebAdministration -ErrorAction Stop
          Stop-WebAppPool -Name Proactive
          Start-Sleep -Seconds 3
          Start-WebAppPool -Name Proactive
          Start-Sleep -Seconds 6
          $tcp = Test-NetConnection -ComputerName 127.0.0.1 -Port 80 -InformationLevel Quiet -WarningAction SilentlyContinue
          Write-Host "RESTART_PROACTIVE_OK TCP80=$tcp"
          if (-not $tcp) { throw 'Port 80 not reachable after restart' }
