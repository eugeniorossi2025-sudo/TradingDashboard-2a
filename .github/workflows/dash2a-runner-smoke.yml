name: DASH2A Runner Smoke

on:
  push:
    branches:
      - codex/dash2a-runner-bootstrap
    paths:
      - .github/workflows/dash2a-runner-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64, DASH2A]
    timeout-minutes: 3
    steps:
      - name: Verify runner service and free disk
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"
          if ($env:RUNNER_NAME -ne 'dash2a-windows-runner-01') { throw 'Unexpected runner' }
          $service = Get-Service -Name 'actions.runner.*' | Where-Object Status -eq Running | Select-Object -First 1
          if (-not $service) { throw 'Runner Windows service is not running' }
          Write-Host "RUNNER_SERVICE=$($service.Name) STATUS=$($service.Status)"
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
          if (-not $disk) { throw 'C: drive unavailable' }
          Write-Host "DISK_C_FREE_GB=$([math]::Round($disk.FreeSpace / 1GB, 1))"
          Write-Host 'DASH2A_RUNNER_SMOKE=PASS'
      - name: Read small IIS and runtime inventory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $iis = Get-Module -ListAvailable WebAdministration | Select-Object -First 1
          Write-Host "IIS_MODULE_PRESENT=$([bool]$iis)"
          if ($iis) {
            Import-Module WebAdministration
            Get-Website | ForEach-Object {
              $site = $_
              Write-Host "IIS_SITE=$($site.Name) STATE=$($site.State) PATH=$($site.PhysicalPath)"
              $site.Bindings.Collection | ForEach-Object { Write-Host "IIS_BINDING=$($_.protocol) $($_.bindingInformation)" }
            }
            Get-ChildItem IIS:\AppPools | ForEach-Object { Write-Host "IIS_POOL=$($_.Name) STATE=$($_.State)" }
          }
          Get-Service -Name 'MSSQL*','W3SVC','WAS' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "SERVICE=$($_.Name) STATUS=$($_.Status)" }
          $dotnet = Get-Command dotnet -ErrorAction SilentlyContinue
          Write-Host "DOTNET_PRESENT=$([bool]$dotnet)"
          if ($dotnet) { dotnet --list-sdks | Select-Object -First 3 | ForEach-Object { Write-Host "DOTNET_SDK=$_" } }
          foreach ($path in @('C:\inetpub\wwwroot\shared\appsettings.Production.json','C:\inetpub\wwwroot\releases','C:\Decisore')) { Write-Host "PATH_PRESENT=$path $(Test-Path -LiteralPath $path)" }
      - name: Check known local SQL backup directories
        shell: powershell
        run: |
          foreach ($root in @('C:\Program Files\Microsoft SQL Server','C:\Backups','C:\Backup','D:\Backups','D:\Backup')) {
            if (-not (Test-Path -LiteralPath $root)) { Write-Host "BACKUP_ROOT_ABSENT=$root"; continue }
            $dirs = if ($root -like '*Microsoft SQL Server') {
              Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue | ForEach-Object { Join-Path $_.FullName 'MSSQL\Backup' }
            } else { @($root) }
            foreach ($dir in $dirs) {
              if (Test-Path -LiteralPath $dir) {
                Get-ChildItem -LiteralPath $dir -File -ErrorAction SilentlyContinue |
                  Where-Object { $_.Extension -in @('.bak','.bacpac','.bkp') } |
                  Select-Object -First 15 | ForEach-Object { Write-Host "BACKUP_FILE=$($_.FullName) SIZE_BYTES=$($_.Length) MODIFIED=$($_.LastWriteTimeUtc.ToString('s'))Z" }
              }
            }
          }
      - name: Check SQL access without writes
        shell: powershell
        run: |
          $sqlcmd = Get-Command sqlcmd -ErrorAction SilentlyContinue
          if (-not $sqlcmd) { Write-Host 'SQLCMD_PRESENT=False'; exit 0 }
          Write-Host 'SQLCMD_PRESENT=True'
          & sqlcmd -S '.\SQLEXPRESS' -E -C -l 4 -b -W -Q "SELECT SYSTEM_USER AS RunnerSqlLogin, IS_SRVROLEMEMBER('dbcreator') AS CanCreateDatabase, IS_SRVROLEMEMBER('sysadmin') AS IsSqlAdmin;"
          Write-Host "SQL_READ_EXIT=$LASTEXITCODE"
      - name: Check hosting prerequisites
        shell: powershell
        run: |
          dotnet --list-runtimes | ForEach-Object { Write-Host "RUNTIME=$_" }
          $module = Join-Path $env:ProgramFiles 'IIS\Asp.Net Core Module\V2\aspnetcorev2.dll'
          Write-Host "ANCM_V2_PRESENT=$(Test-Path -LiteralPath $module)"
          Write-Host "SQL_INSTANCE_RUNNING=$((Get-Service -Name 'MSSQL$SQLEXPRESS').Status)"
