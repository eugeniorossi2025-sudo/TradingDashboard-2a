name: DASH2A Backend Deploy Safe

on:
  workflow_dispatch:
    inputs:
      confirm_safe_backend_deploy:
        description: "Type I_UNDERSTAND_BACKEND_DEPLOY_ONLY to deploy backend only"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dash2a-backend-deploy
  cancel-in-progress: true

jobs:
  deploy-backend:
    name: Build, Publish, Swap IIS PhysicalPath
    if: ${{ github.event.inputs.confirm_safe_backend_deploy == 'I_UNDERSTAND_BACKEND_DEPLOY_ONLY' }}
    runs-on:
      - self-hosted
      - Windows
      - DASH2A
      - DASH2A-BACKEND
    timeout-minutes: 30
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_NOLOGO: "1"
      CONFIGURATION: Release
      PUBLISH_DIR: ${{ github.workspace }}\artifacts\backend-publish
      DASH2A_SITE_NAME: demoapp
      DASH2A_APP_POOL: demoapp
      DASH2A_RELEASE_ROOT: C:\inetpub\wwwroot\releases
      DASH2A_SMOKE_TEST_URL: http://localhost/api/Auth/test

    steps:
      - name: Guard deployment scope
        shell: powershell
        run: |
          if ('${{ github.event.inputs.confirm_safe_backend_deploy }}' -ne 'I_UNDERSTAND_BACKEND_DEPLOY_ONLY') {
            throw 'Manual confirmation input is invalid.'
          }
          Write-Host 'Backend-only deploy confirmed.'
          Write-Host 'No DB migrations. No frontend deploy. No Decisore.'

      - name: Check prerequisites
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = @()

          # .NET SDK
          $dotnet = Get-Command dotnet -ErrorAction SilentlyContinue
          if (-not $dotnet) {
            $dotnet = Get-Command "C:\actions-runner\dotnet\dotnet.exe" -ErrorAction SilentlyContinue
          }
          if ($dotnet) {
            $ver = & $dotnet.Source --version 2>&1
            Write-Host ".NET SDK: $ver at $($dotnet.Source)"
          } else {
            $failed += ".NET SDK non trovato — installare Hosting Bundle sul server"
          }

          # IIS module
          $iis = Get-Module -ListAvailable WebAdministration
          if ($iis) { Write-Host "IIS WebAdministration: OK" }
          else { $failed += "IIS WebAdministration module non trovato" }

          # IIS site
          if ($iis) {
            Import-Module WebAdministration
            $site = Get-Website -Name "$env:DASH2A_SITE_NAME" -ErrorAction SilentlyContinue
            if ($site) { Write-Host "IIS site '$env:DASH2A_SITE_NAME': OK — PhysicalPath=$($site.PhysicalPath)" }
            else { $failed += "IIS site '$env:DASH2A_SITE_NAME' non trovato" }

            $pool = Get-Item "IIS:\AppPools\$env:DASH2A_APP_POOL" -ErrorAction SilentlyContinue
            if ($pool) { Write-Host "App pool '$env:DASH2A_APP_POOL': OK — State=$($pool.State)" }
            else { $failed += "App pool '$env:DASH2A_APP_POOL' non trovato" }
          }

          # Release root
          if (-not (Test-Path $env:DASH2A_RELEASE_ROOT)) {
            New-Item -ItemType Directory -Force -Path $env:DASH2A_RELEASE_ROOT | Out-Null
            Write-Host "Release root creata: $env:DASH2A_RELEASE_ROOT"
          } else {
            Write-Host "Release root: OK"
          }

          if ($failed.Count -gt 0) {
            Write-Host ""
            Write-Host "PREREQUISITI MANCANTI:"
            $failed | ForEach-Object { Write-Host "  - $_" }
            throw "Prerequisiti non soddisfatti. Deploy bloccato."
          }

          Write-Host ""
          Write-Host "Tutti i prerequisiti OK."

      - name: Ensure Git in PATH
        shell: powershell
        run: |
          Add-Content $env:GITHUB_PATH "C:\Program Files\Git\cmd"
          git config --global --add safe.directory "*"

      - name: Ensure .NET SDK in PATH
        shell: powershell
        run: |
          $dotnetDir = "C:\actions-runner\dotnet"
          if (Test-Path "$dotnetDir\dotnet.exe") {
            Add-Content $env:GITHUB_PATH $dotnetDir
            Write-Host ".NET SDK aggiunto al PATH da $dotnetDir"
          } else {
            Write-Host ".NET SDK trovato nel PATH di sistema"
          }
          dotnet --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore backend
        shell: powershell
        run: dotnet restore backend\WebApi\WebApi.csproj

      - name: Build backend Release
        shell: powershell
        run: dotnet build backend\WebApi\WebApi.csproj --configuration $env:CONFIGURATION --no-restore

      - name: Publish backend Release
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path -LiteralPath $env:PUBLISH_DIR) {
            Remove-Item -LiteralPath $env:PUBLISH_DIR -Recurse -Force
          }
          dotnet publish backend\WebApi\WebApi.csproj `
            --configuration $env:CONFIGURATION `
            --output $env:PUBLISH_DIR `
            --no-build `
            --no-self-contained

      - name: Deploy via IIS PhysicalPath swap
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          .\ops\dash2a-readiness\deploy-backend-safe.ps1 `
            -ArtifactPath $env:PUBLISH_DIR `
            -SiteName $env:DASH2A_SITE_NAME `
            -AppPoolName $env:DASH2A_APP_POOL `
            -ReleaseRoot $env:DASH2A_RELEASE_ROOT `
            -SmokeTestUrl $env:DASH2A_SMOKE_TEST_URL
