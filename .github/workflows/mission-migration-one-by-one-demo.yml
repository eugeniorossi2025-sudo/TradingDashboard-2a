name: DASH2A Mission Migration One-By-One Demo

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "DryRun: DEMO_ONE_BY_ONE_DRY_RUN | Apply: DEMO_ONE_BY_ONE_APPLY"
        required: true
        type: string
      mode:
        description: "DryRun or Apply"
        required: true
        type: choice
        options:
          - DryRun
          - Apply
        default: DryRun
      release_tag:
        description: "GitHub release tag with missions_export zip (All export, Demo filtered at import)"
        required: true
        type: string
        default: mission-migration-staging-demo-20260530
      regenerate_dates:
        description: "Regenerate MissionKey and timeline"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  demo-one-by-one:
    name: Demo one-by-one (${{ github.event.inputs.mode }})
    if: |
      (github.event.inputs.mode == 'DryRun' && github.event.inputs.confirm == 'DEMO_ONE_BY_ONE_DRY_RUN') ||
      (github.event.inputs.mode == 'Apply' && github.event.inputs.confirm == 'DEMO_ONE_BY_ONE_APPLY')
    runs-on:
      - self-hosted
      - Windows
      - DASH2A
      - DASH2A-BACKEND
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Preflight Production unchanged
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Data
          $config = Get-Content 'C:\inetpub\wwwroot\shared\appsettings.Production.json' -Raw | ConvertFrom-Json
          $conn = New-Object System.Data.SqlClient.SqlConnection($config.ConnectionStrings.DefaultConnection)
          $conn.Open()
          $cmd = $conn.CreateCommand()
          $cmd.CommandText = "SELECT COUNT(*) FROM dbo.MissionSessions WHERE RuntimeMode='Production'"
          Write-Host "PREFLIGHT_PRODUCTION_SESSIONS=$($cmd.ExecuteScalar())"
          $cmd.CommandText = "SELECT COUNT(*) FROM dbo.MissionSessions WHERE Completed=0"
          Write-Host "PREFLIGHT_OPEN=$($cmd.ExecuteScalar())"
          $cmd.CommandText = "SELECT COUNT(*) FROM dbo.MissionSessions WHERE MissionKey LIKE 'hist-seq-%'"
          Write-Host "PREFLIGHT_HIST_SEQ=$($cmd.ExecuteScalar())"
          if ('${{ github.event.inputs.mode }}' -eq 'Apply') {
            $oc = $conn.CreateCommand(); $oc.CommandText = 'SELECT COUNT(*) FROM dbo.MissionSessions WHERE Completed=0'
            if ([int]$oc.ExecuteScalar() -gt 0) { throw 'Refusing Demo Apply: open mission exists' }
          }
          $conn.Close()

      - name: Download export zip
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'C:\inetpub\wwwroot\backups\mission-migration'
          $staging = Join-Path $base 'staging-demo'
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          $tag = '${{ github.event.inputs.release_tag }}'
          $repo = '${{ github.repository }}'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like 'missions_export*.zip' } | Select-Object -First 1
          if (-not $asset) { throw "Export zip not found on release $tag" }
          $dest = Join-Path $base $asset.name
          Invoke-WebRequest -Uri $asset.url -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream' } -OutFile $dest
          Expand-Archive -LiteralPath $dest -DestinationPath $staging -Force

      - name: Run Demo one-by-one import
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = 'C:\inetpub\wwwroot\backups\mission-migration\staging-demo'
          $meta = Get-ChildItem $staging -Filter 'missions_export_meta_*.json' | Select-Object -First 1
          $script = Join-Path $env:GITHUB_WORKSPACE 'ops/dash2a-readiness/import-missions-one-by-one.ps1'
          $regen = [System.Convert]::ToBoolean('${{ github.event.inputs.regenerate_dates }}')
          & $script -Source Export -MetaFile $meta.FullName -RuntimeModeFilter Demo -Mode '${{ github.event.inputs.mode }}' -RegenerateDates:$regen -OneByOne:$true `
            -SequenceStartDate ([datetime]'2016-01-01T08:00:00Z') `
            -OutDir 'C:\inetpub\wwwroot\backups\mission-migration\one-by-one-demo'

      - name: Post-run Production check
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Data
          $config = Get-Content 'C:\inetpub\wwwroot\shared\appsettings.Production.json' -Raw | ConvertFrom-Json
          $conn = New-Object System.Data.SqlClient.SqlConnection($config.ConnectionStrings.DefaultConnection)
          $conn.Open()
          foreach ($q in @(
            "SELECT COUNT(*) FROM dbo.MissionSessions WHERE RuntimeMode='Production'",
            "SELECT COUNT(*) FROM dbo.MissionSessions WHERE RuntimeMode='Demo'",
            "SELECT COUNT(*) FROM dbo.MissionSessions WHERE MissionKey LIKE 'hist-seq-%'"
          )) {
            $cmd = $conn.CreateCommand(); $cmd.CommandText = $q; Write-Host "POST_$($cmd.ExecuteScalar())"
          }
          $conn.Close()

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-one-by-one-${{ github.event.inputs.mode }}-${{ github.run_id }}
          path: C:\inetpub\wwwroot\backups\mission-migration\one-by-one-demo\**\*
          if-no-files-found: warn
